name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            os: ubuntu-24.04
          - name: Ubuntu arm64
            os: ubuntu-24.04-arm
          - name: Windows x64
            os: windows-2025
          - name: macOS arm64
            os: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Report native runtime
        shell: bash
        run: node -p "process.platform + ' ' + process.arch + ' Node ' + process.version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run DuckDB integration tests
        run: pnpm test:integration

      - name: Compile extension
        run: pnpm compile

      - name: Load language-server bundle
        run: node -e "require('./out/ls/plugin.js')"

  package:
    name: Package VSIX
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package VSIX
        run: pnpm package

      - name: Check VSIX for native binaries
        shell: bash
        run: |
          if unzip -Z1 ./*.vsix | grep -E 'extension/node_modules/@duckdb/|\.node$'; then
            echo "The VSIX must not bundle host-specific native binaries."
            exit 1
          fi

      - name: Upload tested VSIX
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: duckdb-for-sqltools-vsix-${{ github.sha }}
          path: "duckdb-for-sqltools-*.vsix"
          if-no-files-found: error
          archive: false

  gate:
    name: CI gate
    if: always()
    needs: [verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERIFY_RESULT: ${{ needs.verify.result }}
      PACKAGE_RESULT: ${{ needs.package.result }}
    steps:
      - name: Require successful verification and packaging
        shell: bash
        run: |
          if [[ "$VERIFY_RESULT" != "success" || "$PACKAGE_RESULT" != "success" ]]; then
            echo "Verification result: $VERIFY_RESULT"
            echo "Packaging result: $PACKAGE_RESULT"
            exit 1
          fi
